<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Manager — Shared Brain</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3; --dim:#8b949e;
  --acc:#58a6ff; --acc-dim:#58a6ff33; --ok:#3fb950;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;
  padding:14px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;
  background:#0d1117f2;backdrop-filter:blur(8px);z-index:5}
header h1{font-size:17px;margin:0}
header .sub{color:var(--dim);font-size:12px}
header nav{margin-left:auto;display:flex;gap:12px;font-size:13px}
a{color:var(--acc);text-decoration:none}
main{max-width:980px;margin:0 auto;padding:18px 14px 72px}
.npm{margin:0 0 14px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;
  background:var(--panel);font-size:13px;color:var(--dim)}
.npm code{color:var(--fg);font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
.tabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.tabs button{background:var(--panel);color:var(--fg);border:1px solid var(--border);
  border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer}
.tabs button.on{border-color:var(--acc);color:var(--acc);background:var(--acc-dim)}
.row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
input[type=text],input[type=search],select{flex:1;min-width:0;background:var(--panel);
  border:1px solid var(--border);color:var(--fg);border-radius:8px;padding:10px 12px;font:inherit}
button{background:var(--acc);border:0;color:#04121f;border-radius:8px;padding:10px 16px;
  font-weight:600;cursor:pointer}
button.ghost{background:var(--panel);color:var(--fg);border:1px solid var(--border)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:10px 0}
.meta{color:var(--dim);font-size:12px;margin-bottom:6px}
.answer{white-space:pre-wrap;border-left:3px solid var(--acc);padding-left:12px}
pre{white-space:pre-wrap;word-break:break-word;font-size:13px;margin:0}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.chip{background:#21262d;border:1px solid var(--border);color:var(--dim);border-radius:999px;
  padding:5px 11px;font-size:12px;cursor:pointer}
.chip.on{border-color:var(--acc);color:var(--acc);background:var(--acc-dim)}
.elist{display:flex;flex-direction:column;gap:6px}
.erow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:11px 12px;color:var(--fg);font:inherit;cursor:pointer}
.erow:hover{border-color:#484f58}
.erow.selected{border-color:var(--acc);background:var(--acc-dim);box-shadow:inset 3px 0 0 var(--acc)}
.erow .ico{width:1.4em;text-align:center;flex-shrink:0}
.erow .name{flex:1;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.erow .type{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.erow .chev{color:var(--dim);font-size:14px}
.erow.selected .chev{color:var(--acc)}
#entity-detail{display:none;margin-top:12px;border:1px solid var(--acc);background:#0f1722;
  border-radius:12px;overflow:hidden;scroll-margin-top:72px}
#entity-detail.open{display:block;animation:rise .18s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.detail-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;
  border-bottom:1px solid var(--border);background:var(--acc-dim)}
.detail-head h2{margin:0;font-size:17px}
.detail-head .close{margin-left:auto;background:transparent;color:var(--dim);border:1px solid var(--border);
  border-radius:8px;padding:6px 10px;font-weight:500}
.detail-body{padding:14px 16px}
.neighbor{display:inline-flex;align-items:center;gap:6px;background:#21262d;border:1px solid var(--border);
  border-radius:999px;padding:4px 10px;font-size:12px;margin:0 6px 6px 0;cursor:pointer;color:var(--fg)}
.neighbor:hover{border-color:var(--acc)}
.chunk{border-top:1px solid var(--border);padding:10px 0}
.chunk:first-child{border-top:0;padding-top:0}
.empty{color:var(--dim);font-size:13px;padding:18px 8px;text-align:center}
.count{color:var(--dim);font-size:12px;margin:4px 0 10px}
@media (max-width:640px){
  header{padding:12px 14px}
  .erow{padding:12px}
}
</style>
</head>
<body>
<header>
  <h1>Shared Brain</h1>
  <span class="sub" id="stats">…</span>
  <nav>
    <a href="/">Home</a>
    <a href="/setup/">Setup</a>
    <a href="/connect/">Connect</a>
    <a href="/agents/">Agents</a>
  </nav>
</header>
<main>
  <div class="npm">
    Setup any agent with
    <code>npx agent-manager-brain connect --url <span id="npm-url"></span> --token YOUR_TOKEN --agent &lt;platform&gt;</code>
    · <a href="/connect/">one-click copy</a>
    · <a href="https://www.npmjs.com/package/agent-manager-brain" target="_blank" rel="noopener">npm</a>
  </div>

  <div class="tabs">
    <button data-tab="ask" class="on">Ask</button>
    <button data-tab="graph">Entities</button>
    <button data-tab="packs">Context Packs</button>
  </div>

  <section id="tab-ask">
    <div class="row">
      <input type="text" id="q" placeholder="Ask the brain anything about your projects…">
      <button onclick="ask()">Ask</button>
    </div>
    <div id="answer"></div>
    <div id="results"></div>
  </section>

  <section id="tab-graph" style="display:none">
    <div class="row">
      <input type="search" id="entity-q" placeholder="Search entities…" autocomplete="off">
    </div>
    <div class="filters" id="type-filters"></div>
    <div class="count" id="entity-count"></div>
    <div class="elist" id="entity-list"></div>
    <div id="entity-detail">
      <div class="detail-head">
        <div>
          <div class="meta" id="detail-type"></div>
          <h2 id="detail-title"></h2>
          <div class="meta" id="detail-blurb"></div>
        </div>
        <button class="close" type="button" onclick="closeDetail()">Close</button>
      </div>
      <div class="detail-body">
        <div class="meta">Related</div>
        <div id="detail-neighbors"></div>
        <div class="meta" style="margin-top:14px">Mentions</div>
        <div id="detail-chunks"></div>
      </div>
    </div>
    <p class="empty" id="entity-hint">Tap a row to open its details below.</p>
  </section>

  <section id="tab-packs" style="display:none">
    <div class="row">
      <select id="project"></select>
      <button class="ghost" onclick="loadPack()">Load pack</button>
      <button class="ghost" onclick="copyPack()">Copy</button>
    </div>
    <div class="card"><pre id="pack">Select a project to get an injectable context pack.</pre></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
let TOKEN = localStorage.getItem('am_token') || localStorage.getItem('brain_token') || '';
const TOKEN_KEY = 'am_token';
let ENTITIES = [];
let FILTER_TYPE = 'all';
let SELECTED = null;

$('#npm-url').textContent = location.origin.replace(/\/$/, '');

async function api(path, opts={}) {
  const r = await fetch(path.startsWith('/') ? path : '/' + path, {
    ...opts,
    headers: {
      'X-Token': TOKEN,
      'Content-Type': 'application/json',
      ...(opts.headers || {}),
    },
  });
  if (r.status === 401) {
    TOKEN = prompt('Token required:') || '';
    localStorage.setItem(TOKEN_KEY, TOKEN);
    return api(path, opts);
  }
  return r.json();
}

const icon = t => ({
  project: '📦', service: '⚙️', port: '🔌', model: '🤖',
  host: '🖥️', tool: '🔧', person: '👤',
}[t] || '•');

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}

async function boot() {
  const s = await api('/api/stats');
  $('#stats').textContent =
    `${s.sources} sources · ${s.chunks} chunks · ${s.entities} entities · ${s.edges} edges`;
  const ps = await api('/api/projects');
  $('#project').innerHTML = (ps.projects || []).map(p => `<option>${esc(p)}</option>`).join('');
  const es = await api('/api/entities');
  ENTITIES = es.entities || [];
  renderTypeFilters();
  renderEntities();
}

function renderTypeFilters() {
  const types = ['all', ...new Set(ENTITIES.map(e => e.type).filter(Boolean))].sort((a, b) => {
    if (a === 'all') return -1;
    if (b === 'all') return 1;
    return a.localeCompare(b);
  });
  $('#type-filters').innerHTML = types.map(t => {
    const label = t === 'all' ? 'All' : `${icon(t)} ${t}`;
    const n = t === 'all' ? ENTITIES.length : ENTITIES.filter(e => e.type === t).length;
    return `<button type="button" class="chip ${t === FILTER_TYPE ? 'on' : ''}" data-type="${esc(t)}">${label} <span class="meta" style="margin:0">(${n})</span></button>`;
  }).join('');
}

function filteredEntities() {
  const q = ($('#entity-q').value || '').trim().toLowerCase();
  return ENTITIES.filter(e => {
    if (FILTER_TYPE !== 'all' && e.type !== FILTER_TYPE) return false;
    if (!q) return true;
    return (e.name || '').toLowerCase().includes(q)
      || (e.type || '').toLowerCase().includes(q)
      || (e.blurb || '').toLowerCase().includes(q);
  });
}

function renderEntities() {
  const rows = filteredEntities();
  $('#entity-count').textContent = `${rows.length} shown · tap a row for details`;
  if (!rows.length) {
    $('#entity-list').innerHTML = '<div class="empty">No entities match this filter.</div>';
    return;
  }
  $('#entity-list').innerHTML = rows.map(e => {
    const selected = SELECTED === e.name ? 'selected' : '';
    const safe = e.name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    return `<button type="button" class="erow ${selected}" data-name="${esc(e.name)}" onclick="showEntity('${safe}')">
      <span class="ico">${icon(e.type)}</span>
      <span class="name">${esc(e.name)}</span>
      <span class="type">${esc(e.type || 'entity')}</span>
      <span class="chev">${SELECTED === e.name ? '▾' : '›'}</span>
    </button>`;
  }).join('');
}

async function showEntity(name) {
  SELECTED = name;
  renderEntities();
  const detail = $('#entity-detail');
  detail.classList.add('open');
  $('#entity-hint').style.display = 'none';
  $('#detail-title').textContent = name;
  $('#detail-type').textContent = 'Loading details…';
  $('#detail-blurb').textContent = '';
  $('#detail-neighbors').innerHTML = '';
  $('#detail-chunks').innerHTML = '<div class="meta">…</div>';
  detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  const c = await api('/api/entity?name=' + encodeURIComponent(name));
  if (c.error) {
    $('#detail-type').textContent = 'Not found';
    $('#detail-chunks').innerHTML = '';
    return;
  }
  const ent = c.entity || {};
  $('#detail-type').textContent = `${icon(ent.type)} ${ent.type || 'entity'}`;
  $('#detail-title').textContent = ent.name || name;
  $('#detail-blurb').textContent = ent.blurb || '';

  const neighbors = c.neighbors || [];
  $('#detail-neighbors').innerHTML = neighbors.length
    ? neighbors.map(n => {
        const safe = n.name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        return `<button type="button" class="neighbor" onclick="showEntity('${safe}')">${icon(n.type)} ${esc(n.name)} <span class="meta" style="margin:0">${esc(n.rel || '')}</span></button>`;
      }).join('')
    : '<span class="meta">No related entities yet.</span>';

  const chunks = c.chunks || [];
  $('#detail-chunks').innerHTML = chunks.length
    ? chunks.map(ch => `<div class="chunk">
        <div class="meta">${esc(ch.project || '')} · ${esc(ch.path || '')}${ch.heading ? ' · ' + esc(ch.heading) : ''}</div>
        ${esc((ch.text || '').slice(0, 500))}
      </div>`).join('')
    : '<span class="meta">No mentions indexed yet.</span>';
}

function closeDetail() {
  SELECTED = null;
  $('#entity-detail').classList.remove('open');
  $('#entity-hint').style.display = '';
  renderEntities();
}

async function ask() {
  const q = $('#q').value.trim();
  if (!q) return;
  $('#answer').innerHTML = '<div class="meta">thinking…</div>';
  const d = await api('/api/ask', { method: 'POST', body: JSON.stringify({ q, use_llm: true }) });
  $('#answer').innerHTML = d.answer
    ? `<div class="card"><div class="meta">grounded answer</div><div class="answer">${esc(d.answer)}</div></div>`
    : '';
  $('#results').innerHTML = (d.results || []).map(r =>
    `<div class="card"><div class="meta">${esc(r.project || '')} · ${esc(r.kind)} · ${esc(r.path)}</div>
     ${r.heading ? `<b>${esc(r.heading)}</b><br>` : ''}${esc((r.text || '').slice(0, 600))}</div>`
  ).join('');
}

async function loadPack() {
  const p = $('#project').value;
  const d = await api('/api/context?project=' + encodeURIComponent(p));
  $('#pack').textContent = d.pack || '(empty)';
}
function copyPack() { navigator.clipboard.writeText($('#pack').textContent); }

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  ['ask', 'graph', 'packs'].forEach(t => {
    $('#tab-' + t).style.display = t === b.dataset.tab ? '' : 'none';
  });
});

$('#type-filters').addEventListener('click', e => {
  const btn = e.target.closest('[data-type]');
  if (!btn) return;
  FILTER_TYPE = btn.dataset.type;
  renderTypeFilters();
  renderEntities();
});
$('#entity-q').addEventListener('input', renderEntities);
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });

boot();
</script>
</body>
</html>
