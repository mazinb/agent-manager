<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Manager — Shared Brain</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--fg:#e6edf3;--dim:#8b949e;--acc:#58a6ff;}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:baseline;gap:12px;padding:16px 24px;border-bottom:1px solid var(--border)}
  header h1{font-size:18px;margin:0}header .sub{color:var(--dim);font-size:13px}
  main{max-width:960px;margin:0 auto;padding:20px 16px 60px}
  .row{display:flex;gap:8px;margin:12px 0}
  input[type=text]{flex:1;background:var(--panel);border:1px solid var(--border);color:var(--fg);
  border-radius:8px;padding:10px 14px;font-size:15px}
  button{background:var(--acc);border:0;color:#04121f;border-radius:8px;padding:10px 18px;
  font-weight:600;cursor:pointer}button.ghost{background:var(--panel);color:var(--fg);border:1px solid var(--border)}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:10px 0}
  .meta{color:var(--dim);font-size:12px;margin-bottom:6px}
  .answer{white-space:pre-wrap;border-left:3px solid var(--acc);padding-left:12px}
  .tabs{display:flex;gap:4px;margin:16px 0}
  .tabs button{border-radius:8px 8px 0 0}.tabs button.on{background:var(--panel);color:var(--acc)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
  .tag{display:inline-block;background:#21262d;border:1px solid var(--border);border-radius:12px;
  padding:2px 10px;font-size:12px;margin:2px 4px 2px 0;cursor:pointer}
  select{background:var(--panel);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:8px}
  pre{white-space:pre-wrap;word-break:break-word;font-size:13px;color:var(--fg)}
  #stats{color:var(--dim);font-size:12px;margin:8px 0}
  a{color:var(--acc)}
</style>
</head>
<body>
<header><h1>Shared Brain</h1><span class="sub" id="stats">…</span>
  <a href="/connect/" style="margin-left:auto;font-size:13px">Connect</a>
  <a href="/" style="font-size:13px">Agents</a></header>
<main>
  <div class="tabs">
    <button data-tab="ask" class="on">Ask</button>
    <button data-tab="graph">Entities</button>
    <button data-tab="packs">Context Packs</button>
  </div>

  <section id="tab-ask">
    <div class="row">
      <input type="text" id="q" placeholder="Ask the brain anything about your projects…">
      <button onclick="ask()">Ask</button>
    </div>
    <div id="answer"></div>
    <div id="results"></div>
  </section>

  <section id="tab-graph" style="display:none">
    <div id="entity-list"></div>
    <div id="entity-card"></div>
  </section>

  <section id="tab-packs" style="display:none">
    <div class="row">
      <select id="project"></select>
      <button class="ghost" onclick="loadPack()">Load pack</button>
      <button class="ghost" onclick="copyPack()">Copy</button>
    </div>
    <div class="card"><pre id="pack">Select a project to get an injectable context pack.</pre></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
let TOKEN = localStorage.getItem('am_token') || localStorage.getItem('brain_token') || '';
const TOKEN_KEY = 'am_token';
async function api(path, opts={}) {
  const r = await fetch(path.startsWith('/') ? path : '/' + path, {...opts, headers:{'X-Token': TOKEN,
    'Content-Type':'application/json', ...(opts.headers||{})}});
  if (r.status===401) {
    TOKEN = prompt('Token required:'); localStorage.setItem(TOKEN_KEY, TOKEN);
    return api(path, opts);
  }
  return r.json();
}
async function boot(){
  const s = await api('/api/stats');
  $('#stats').textContent = `${s.sources} sources · ${s.chunks} chunks · ${s.entities} entities · ${s.edges} edges`;
  const ps = await api('/api/projects');
  $('#project').innerHTML = ps.projects.map(p=>`<option>${p}</option>`).join('');
  const es = await api('/api/entities');
  $('#entity-list').innerHTML = '<div class="grid">'+es.entities.map(e=>
    `<span class="tag" onclick="showEntity('${e.name.replace(/'/g,"\\'")}')">${icon(e.type)} ${e.name}</span>`).join('')+'</div>';
}
const icon = t => ({project:'📦',service:'⚙️',port:'🔌',model:'🤖',host:'🖥️',tool:'🔧',person:'👤'}[t]||'•');
async function ask(){
  const q = $('#q').value.trim(); if(!q) return;
  $('#answer').innerHTML='<div class="meta">thinking…</div>';
  const d = await api('/api/ask',{method:'POST',body:JSON.stringify({q,use_llm:true})});
  $('#answer').innerHTML = d.answer
    ? `<div class="card"><div class="meta">grounded answer</div><div class="answer">${esc(d.answer)}</div></div>`
    : '';
  $('#results').innerHTML = d.results.map(r=>
    `<div class="card"><div class="meta">${esc(r.project||'')} · ${esc(r.kind)} · ${esc(r.path)}</div>
     ${r.heading?`<b>${esc(r.heading)}</b><br>`:''}${esc(r.text.slice(0,600))}</div>`).join('');
}
async function showEntity(name){
  const c = await api('/api/entity?name='+encodeURIComponent(name));
  if(c.error){$('#entity-card').innerHTML='';return;}
  $('#entity-card').innerHTML = `<div class="card"><b>${icon(c.entity.type)} ${esc(c.entity.name)}</b>
   <span class="meta"> ${c.entity.type}</span>
   <div class="grid" style="margin:8px 0">${c.neighbors.map(n=>`<span class="tag">${esc(n.name)} <span class="meta">${esc(n.rel)}</span></span>`).join('')}</div>
   ${c.chunks.map(ch=>`<div class="meta">${esc(ch.project)} · ${esc(ch.path)}</div>${esc(ch.text.slice(0,300))}<hr>`).join('')}</div>`;
}
async function loadPack(){
  const p = $('#project').value;
  const d = await api('/api/context?project='+encodeURIComponent(p));
  $('#pack').textContent = d.pack || '(empty)';
}
function copyPack(){navigator.clipboard.writeText($('#pack').textContent);}
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  ['ask','graph','packs'].forEach(t=>$('#tab-'+t).style.display = t===b.dataset.tab?'':'none');
});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')ask();});
boot();
</script>
</body>
</html>
