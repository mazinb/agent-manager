<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain — Zoro</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --border:#21262d; --border-strong:#30363d;
  --fg:#e6edf3; --dim:#8b949e; --acc:#58a6ff; --acc-dim:#58a6ff33; --ok:#3fb950;
  --tint:#18202b; --danger:#f85149;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --chrome-h:48px; --tabs-h:40px; --ctrl-h:52px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.45 ui-sans-serif,system-ui,sans-serif}
a{color:var(--acc);text-decoration:none}

/* —— sticky chrome: shared Zoro top + tabs + controls —— */
.chrome{position:sticky;top:0;z-index:30;background:#0d1117f5;
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.top{display:flex;align-items:center;gap:10px;height:var(--chrome-h);
  padding:0 14px;border-bottom:1px solid var(--border)}
.top .brand{font-size:15px;font-weight:700;color:var(--fg);white-space:nowrap;letter-spacing:-.02em}
.top .brand:hover{color:var(--acc)}
.stats{margin-left:4px;color:var(--dim);font:12px/1 var(--mono);
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats:empty{display:none}
.top nav{margin-left:auto;display:flex;gap:2px;flex-shrink:0}
.top nav a{color:var(--dim);font-size:13px;padding:6px 10px;border-radius:8px;white-space:nowrap}
.top nav a:hover{color:var(--fg);background:#21262d}
.top nav a.on{color:var(--acc);background:var(--acc-dim)}

.tabs{display:flex;align-items:stretch;gap:0;height:var(--tabs-h);padding:0 10px;
  border-bottom:1px solid var(--border)}
.tabs button{appearance:none;background:transparent;color:var(--dim);border:0;
  border-bottom:2px solid transparent;margin-bottom:-1px;padding:0 14px;
  font:13px/1 ui-sans-serif,system-ui,sans-serif;font-weight:550;
  cursor:pointer;height:100%;transition:color .08s linear,border-color .08s linear}
.tabs button:hover{color:var(--fg)}
.tabs button.on{color:var(--fg);border-bottom-color:var(--acc)}
.tabs button:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}

.controls{display:none;align-items:center;gap:8px;min-height:var(--ctrl-h);
  padding:8px 14px;background:var(--bg)}
.controls.show{display:flex}
.controls .row{display:flex;gap:8px;flex:1;min-width:0;margin:0;flex-wrap:nowrap}
input[type=text],input[type=search],select{
  flex:1;min-width:0;height:36px;background:var(--panel);
  border:1px solid var(--border-strong);color:var(--fg);border-radius:6px;
  padding:0 12px;font:inherit}
button.act{height:36px;padding:0 14px;border:0;border-radius:6px;
  background:var(--acc);color:#04121f;font-weight:650;font-size:13px;cursor:pointer;
  white-space:nowrap;flex-shrink:0}
button.act:active{transform:translateY(1px)}
button.ghost{height:36px;padding:0 12px;background:var(--panel);color:var(--fg);
  border:1px solid var(--border-strong);border-radius:6px;font-weight:550;font-size:13px;
  cursor:pointer;white-space:nowrap;flex-shrink:0}
button.ghost:hover{border-color:#484f58}
button.ghost.on-public{border-color:var(--ok);color:var(--ok)}

main{max-width:980px;margin:0 auto;padding:16px 14px 72px}
.panel{display:none}
.panel.on{display:block}
.panel.loading .skeleton{display:block}
.skeleton{display:none;height:14px;margin:10px 0;border-radius:4px;
  background:linear-gradient(90deg,#161b22 25%,#1c2330 50%,#161b22 75%);
  background-size:200% 100%;animation:shimmer .9s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}

.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin:10px 0}
.meta{color:var(--dim);font-size:12px;margin-bottom:6px;font-variant-numeric:tabular-nums}
.meta .sep{color:#484f58}
.answer{border-left:2px solid var(--border-strong);padding-left:14px;margin:4px 0 12px}
pre{white-space:pre-wrap;word-break:break-word;font-size:13px;margin:0;font-family:var(--mono)}
code{font-family:var(--mono);font-size:.92em;background:#21262d;border-radius:4px;padding:1px 5px}

.filters{display:flex;flex-wrap:wrap;gap:2px 10px;margin:0 0 6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--dim);
  padding:4px 2px;font-size:12.5px;cursor:pointer;font-family:var(--mono)}
.chip:hover{color:var(--fg)}
.chip.on{color:var(--fg)}
.chip .n{color:var(--dim);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;display:inline-block}
.elist{margin:4px 0 0}
.erow{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;text-align:left;
  background:transparent;border:0;padding:8px 4px;color:var(--fg);font:inherit;cursor:pointer}
.erow + .erow{border-top:1px solid var(--border)}
.erow:hover{background:#131a24}
.erow.selected{background:var(--tint)}
.erow .name{flex:1;font-family:var(--mono);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.erow .cnt{font-family:var(--mono);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
#entity-detail{display:none;margin-top:12px;border:1px solid var(--border-strong);background:var(--panel);
  border-radius:8px;overflow:hidden;scroll-margin-top:calc(var(--chrome-h) + var(--tabs-h) + 8px)}
#entity-detail.open{display:block}
.detail-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;
  border-bottom:1px solid var(--border)}
.detail-head h2{margin:0;font-size:15px;font-family:var(--mono);word-break:break-word}
.detail-head .type{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:12px;
  font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em}
.detail-head .close{margin-left:auto;background:transparent;color:var(--dim);border:1px solid var(--border-strong);
  border-radius:6px;padding:6px 10px;font-weight:500;flex-shrink:0;height:auto}
.detail-head .close:hover{color:var(--fg)}
.detail-body{padding:14px 16px}
.neighbor{display:inline-flex;align-items:center;background:#21262d;border:0;
  border-radius:4px;padding:4px 8px;font-size:12px;margin:0 6px 6px 0;cursor:pointer;
  color:var(--fg);font-family:var(--mono)}
.neighbor:hover{background:#2b3138}
.chunk{border-top:1px solid var(--border);padding:10px 0}
.chunk:first-child{border-top:0;padding-top:0}
.chunk .meta{font-family:var(--mono)}
.result{border-top:1px solid var(--border);padding:12px 0}
.result:first-child{border-top:0;padding-top:0}
.result .meta{font-family:var(--mono)}
.result .heading{font-weight:600;margin:0 0 4px}
.badge{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:600;vertical-align:1px}
.badge.stale{background:#5c2b2b;color:#ffb4a9}
.badge.conf{background:#2b3a4a;color:#9cc3e0}
.badge.origin{background:#243028;color:#8fd19e}
.md p{margin:0 0 8px}
.md p:last-child{margin:0}
.md ul,.md ol{margin:0 0 8px;padding-left:20px}
.md li{margin:2px 0}
.empty{color:var(--dim);font-size:13px;padding:18px 8px;text-align:center}
.count{color:var(--dim);font-size:12px;margin:4px 0 10px;font-variant-numeric:tabular-nums}

@media (max-width:640px){
  .top{padding:0 10px;gap:8px}
  .top nav a{padding:6px 8px}
  .stats{max-width:42vw}
  .tabs{padding:0 6px}
  .tabs button{padding:0 12px}
  .controls{padding:8px 10px}
  main{padding:12px 10px 64px}
  .controls .row{flex-wrap:wrap}
  button.act,button.ghost{flex:0 0 auto}
}
</style>
</head>
<body>
<div class="chrome">
  <header class="top">
    <a class="brand" href="/">Zoro</a>
    <span class="stats" id="stats"></span>
    <nav>
      <a href="/inbox/">Inbox</a>
      <a href="/connect/">Connect</a>
      <a class="on" href="/brain/">Brain</a>
    </nav>
  </header>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="ask" class="on" aria-selected="true">Ask</button>
    <button type="button" role="tab" data-tab="graph" aria-selected="false">Entities</button>
    <button type="button" role="tab" data-tab="packs" aria-selected="false">Packs</button>
  </div>
  <div class="controls show" id="ctrl-ask">
    <div class="row">
      <input type="text" id="q" placeholder="Ask…" autocomplete="off">
      <button type="button" class="act" id="ask-btn">Ask</button>
    </div>
  </div>
  <div class="controls" id="ctrl-graph">
    <div class="row">
      <input type="search" id="entity-q" placeholder="Filter…" autocomplete="off">
    </div>
  </div>
  <div class="controls" id="ctrl-packs">
    <div class="row">
      <select id="project" aria-label="Project"></select>
      <button type="button" class="ghost" id="visbtn">private</button>
      <button type="button" class="ghost" id="copy-btn">Copy</button>
    </div>
  </div>
</div>

<main>
  <section id="tab-ask" class="panel on loading" role="tabpanel">
    <div class="skeleton" style="width:55%"></div>
    <div class="skeleton" style="width:88%"></div>
    <div id="answer"></div>
    <div id="results"></div>
  </section>

  <section id="tab-graph" class="panel loading" role="tabpanel">
    <div class="filters" id="type-filters"></div>
    <div class="count" id="entity-count"></div>
    <div class="elist" id="entity-list">
      <div class="skeleton" style="width:70%"></div>
      <div class="skeleton" style="width:62%"></div>
      <div class="skeleton" style="width:78%"></div>
    </div>
    <div id="entity-detail">
      <div class="detail-head">
        <div>
          <span class="type" id="detail-type"></span>
          <h2 id="detail-title"></h2>
          <div class="meta" id="detail-blurb"></div>
        </div>
        <button class="close" type="button" id="close-detail">Close</button>
      </div>
      <div class="detail-body">
        <div class="meta">Related</div>
        <div id="detail-neighbors"></div>
        <div class="meta" style="margin-top:14px">Mentions</div>
        <div id="detail-chunks"></div>
      </div>
    </div>
  </section>

  <section id="tab-packs" class="panel" role="tabpanel">
    <div class="card"><pre id="pack">Pick a project.</pre></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
let TOKEN = localStorage.getItem('am_token') || localStorage.getItem('brain_token') || '';
const TOKEN_KEY = 'am_token';
let ENTITIES = [];
let FILTER_TYPE = 'all';
let SELECTED = null;
let VIS = {};
let TAB = 'ask';
let READY = false;

async function api(path, opts={}) {
  const r = await fetch(path.startsWith('/') ? path : '/' + path, {
    ...opts,
    headers: {
      'X-Token': TOKEN,
      'Content-Type': 'application/json',
      ...(opts.headers || {}),
    },
  });
  if (r.status === 401) {
    TOKEN = prompt('Token:') || '';
    localStorage.setItem(TOKEN_KEY, TOKEN);
    return api(path, opts);
  }
  return r.json();
}

const TYPE_COLORS = {
  project: '#3fb950', service: '#58a6ff', port: '#d29922', model: '#bc8cff',
  host: '#f0883e', tool: '#39c5cf', person: '#f85149',
};
const typeColor = t => TYPE_COLORS[t] || '#8b949e';
const dot = t => `<span class="dot" style="background:${typeColor(t)}"></span>`;

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}

function inlineMd(s) {
  let out = esc(s);
  const codes = [];
  out = out.replace(/`([^`\n]+)`/g, (_, c) => {
    codes.push(c);
    return '\x00' + (codes.length - 1) + '\x00';
  });
  out = out.replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+|mailto:[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  out = out.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/\x00(\d+)\x00/g, (_, i) => '<code>' + codes[i] + '</code>');
  return out;
}

function renderMd(text) {
  const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
  let html = '', list = null, para = [];
  const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
  const flushPara = () => {
    if (para.length) {
      html += `<p>${para.map(inlineMd).join('<br>')}</p>`;
      para = [];
    }
  };
  for (const line of lines) {
    const t = line.trim();
    const ul = /^[-*]\s+(.*)$/.exec(t);
    const ol = /^\d+[.)]\s+(.*)$/.exec(t);
    if (ul) { flushPara(); if (list !== 'ul') { closeList(); html += '<ul>'; list = 'ul'; } html += `<li>${inlineMd(ul[1])}</li>`; }
    else if (ol) { flushPara(); if (list !== 'ol') { closeList(); html += '<ol>'; list = 'ol'; } html += `<li>${inlineMd(ol[1])}</li>`; }
    else if (!t) { flushPara(); closeList(); }
    else { para.push(t); }
  }
  flushPara();
  closeList();
  return html;
}

function excerpt(text, n) {
  const t = String(text || '').trim();
  if (t.length <= n) return t;
  const win = t.slice(0, n);
  const sent = Math.max(win.lastIndexOf('. '), win.lastIndexOf('! '), win.lastIndexOf('? '));
  let cut = sent > n * 0.4 ? win.slice(0, sent + 1) : win.slice(0, win.lastIndexOf(' '));
  if (!cut) cut = win;
  return cut.replace(/[\s,;:]+$/, '') + '…';
}

function setTab(name) {
  TAB = name;
  document.querySelectorAll('.tabs button').forEach(b => {
    const on = b.dataset.tab === name;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  ['ask', 'graph', 'packs'].forEach(t => {
    $('#tab-' + t).classList.toggle('on', t === name);
    $('#ctrl-' + t).classList.toggle('show', t === name);
  });
  try { history.replaceState(null, '', '#' + name); } catch (_) {}
  if (name === 'packs' && READY) loadPack();
  if (name === 'ask') requestAnimationFrame(() => $('#q').focus());
  if (name === 'graph') requestAnimationFrame(() => $('#entity-q').focus());
}

async function boot() {
  const hash = (location.hash || '').replace('#', '');
  if (['ask', 'graph', 'packs'].includes(hash)) setTab(hash);

  const [s, ps, es] = await Promise.all([
    api('/api/stats'),
    api('/api/projects'),
    api('/api/entities'),
  ]);
  $('#stats').textContent = `${s.entities || 0} · ${s.chunks || 0}`;
  VIS = ps.visibility || {};
  const projects = ps.projects || [];
  $('#project').innerHTML = projects.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
  updateVisBtn();
  ENTITIES = es.entities || [];
  renderTypeFilters();
  renderEntities();
  $('#tab-ask').classList.remove('loading');
  $('#tab-graph').classList.remove('loading');
  READY = true;
  if (TAB === 'packs') loadPack();
}

function renderTypeFilters() {
  const types = ['all', ...new Set(ENTITIES.map(e => e.type).filter(Boolean))].sort((a, b) => {
    if (a === 'all') return -1;
    if (b === 'all') return 1;
    return a.localeCompare(b);
  });
  $('#type-filters').innerHTML = types.map(t => {
    const label = t === 'all' ? '<span>All</span>' : `${dot(t)}<span>${esc(t)}</span>`;
    const n = t === 'all' ? ENTITIES.length : ENTITIES.filter(e => e.type === t).length;
    return `<button type="button" class="chip ${t === FILTER_TYPE ? 'on' : ''}" data-type="${esc(t)}">${label} <span class="n">(${n})</span></button>`;
  }).join('');
}

function filteredEntities() {
  const q = ($('#entity-q').value || '').trim().toLowerCase();
  return ENTITIES.filter(e => {
    if (FILTER_TYPE !== 'all' && e.type !== FILTER_TYPE) return false;
    if (!q) return true;
    return (e.name || '').toLowerCase().includes(q)
      || (e.type || '').toLowerCase().includes(q)
      || (e.blurb || '').toLowerCase().includes(q);
  });
}

function renderEntities() {
  const rows = filteredEntities();
  $('#entity-count').textContent = rows.length === 1 ? '1 entity' : `${rows.length} entities`;
  if (!rows.length) {
    $('#entity-list').innerHTML = '<div class="empty">No entities match this filter.</div>';
    return;
  }
  $('#entity-list').innerHTML = rows.map(e => {
    const selected = SELECTED === e.name ? 'selected' : '';
    const safe = e.name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    return `<button type="button" class="erow ${selected}" data-name="${esc(e.name)}" onclick="showEntity('${safe}')">
      ${dot(e.type)}
      <span class="name">${esc(e.name)}</span>
      <span class="cnt">${e.mentions || 0}</span>
    </button>`;
  }).join('');
}

async function showEntity(name) {
  SELECTED = name;
  renderEntities();
  const detail = $('#entity-detail');
  detail.classList.add('open');
  $('#detail-title').textContent = name;
  $('#detail-type').innerHTML = '<span>…</span>';
  $('#detail-blurb').textContent = '';
  $('#detail-neighbors').innerHTML = '';
  $('#detail-chunks').innerHTML = '';
  detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  const c = await api('/api/entity?name=' + encodeURIComponent(name));
  if (c.error) {
    $('#detail-type').innerHTML = '<span>Not found</span>';
    return;
  }
  const ent = c.entity || {};
  $('#detail-type').innerHTML = `${dot(ent.type)}<span>${esc(ent.type || 'entity')}</span>`;
  $('#detail-title').textContent = ent.name || name;
  $('#detail-blurb').textContent = ent.blurb || '';

  const neighbors = c.neighbors || [];
  $('#detail-neighbors').innerHTML = neighbors.length
    ? neighbors.map(n => {
        const safe = n.name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        return `<button type="button" class="neighbor" onclick="showEntity('${safe}')">${esc(n.name)}</button>`;
      }).join('')
    : '<span class="meta">No related entities yet.</span>';

  const chunks = c.chunks || [];
  $('#detail-chunks').innerHTML = chunks.length
    ? chunks.map(ch => `<div class="chunk">
        <div class="meta">${esc(ch.project || '')} <span class="sep">·</span> ${esc(ch.path || '')}${ch.heading ? ` <span class="sep">·</span> ${esc(ch.heading)}` : ''}</div>
        <div class="md">${renderMd(excerpt(ch.text, 500))}</div>
      </div>`).join('')
    : '<span class="meta">No mentions indexed yet.</span>';
}

function closeDetail() {
  SELECTED = null;
  $('#entity-detail').classList.remove('open');
  renderEntities();
}

async function ask() {
  const q = $('#q').value.trim();
  if (!q) return;
  const btn = $('#ask-btn');
  btn.disabled = true;
  $('#answer').innerHTML = '<div class="meta">…</div>';
  $('#results').innerHTML = '';
  try {
    const d = await api('/api/ask', { method: 'POST', body: JSON.stringify({ q, use_llm: true }) });
    $('#answer').innerHTML = d.answer
      ? `<div class="answer md">${renderMd(d.answer)}</div>`
      : '';
    $('#results').innerHTML = (d.results || []).map(r => {
      let t = r.text || '';
      if (r.heading) {
        const m = t.match(/^#{1,6}\s+(.+?)(?:\n|$)/);
        if (m && m[1].trim().toLowerCase() === String(r.heading).trim().toLowerCase()) {
          t = t.slice(m[0].length);
        }
      }
      const badges = [];
      if (r.kind === 'note') {
        badges.push('<span class="badge origin" title="Agent-written note">note</span>');
        if (r.stale) badges.push('<span class="badge stale" title="Based-on source changed or vanished">STALE</span>');
        if (r.confidence != null) badges.push(`<span class="badge conf">conf ${Math.round(r.confidence * 100)}%</span>`);
        if (r.verified_at) badges.push(`<span class="badge conf">✓ ${new Date(r.verified_at * 1000).toISOString().slice(0, 10)}</span>`);
      } else {
        badges.push('<span class="badge origin" title="Ingested source document">doc</span>');
      }
      return `<div class="result"><div class="meta">${esc(r.project || '')} <span class="sep">·</span> ${esc(r.kind)} <span class="sep">·</span> ${esc(r.path)} ${badges.join(' ')}</div>
       ${r.heading ? `<div class="heading">${esc(r.heading)}</div>` : ''}<div class="md">${renderMd(excerpt(t, 600))}</div></div>`;
    }).join('');
  } finally {
    btn.disabled = false;
  }
}

function updateVisBtn() {
  const p = $('#project').value;
  const b = $('#visbtn');
  if (!b) return;
  const v = VIS[p] || 'private';
  b.textContent = v;
  b.classList.toggle('on-public', v === 'public');
  b.title = v === 'public'
    ? 'Public: other projects can see this content'
    : 'Private: only this project’s agents see it';
}

async function toggleVis() {
  const p = $('#project').value;
  if (!p) return;
  const next = (VIS[p] || 'private') === 'public' ? 'private' : 'public';
  const b = $('#visbtn');
  b.disabled = true;
  try {
    const out = await api('/api/project/visibility', {
      method: 'POST',
      body: JSON.stringify({ project: p, visibility: next }),
    });
    if (out.error) throw new Error(out.error);
    VIS[p] = next;
    updateVisBtn();
  } catch (e) {
    b.title = String(e.message || e);
  } finally {
    b.disabled = false;
  }
}

async function loadPack() {
  const p = $('#project').value;
  if (!p) { $('#pack').textContent = 'Pick a project.'; return; }
  $('#pack').textContent = '…';
  const d = await api('/api/context?project=' + encodeURIComponent(p));
  $('#pack').textContent = d.pack || '(empty)';
}

function copyPack() {
  const t = $('#pack').textContent || '';
  if (navigator.clipboard) navigator.clipboard.writeText(t);
}

document.querySelectorAll('.tabs button').forEach(b => {
  b.addEventListener('click', () => setTab(b.dataset.tab));
});
$('#ask-btn').addEventListener('click', ask);
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
$('#visbtn').addEventListener('click', toggleVis);
$('#copy-btn').addEventListener('click', copyPack);
$('#project').addEventListener('change', () => { updateVisBtn(); loadPack(); });
$('#close-detail').addEventListener('click', closeDetail);
$('#type-filters').addEventListener('click', e => {
  const btn = e.target.closest('[data-type]');
  if (!btn) return;
  FILTER_TYPE = btn.dataset.type;
  renderTypeFilters();
  renderEntities();
});
$('#entity-q').addEventListener('input', renderEntities);

boot();
</script>
</body>
</html>
