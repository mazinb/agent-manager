<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents — Agent Manager</title>
<link rel="stylesheet" href="/static/app.css">
<style>
body{display:flex;flex-direction:column;height:100vh}
.shell{display:flex;flex:1;min-height:0}
#sidebar{width:210px;background:#010409;border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0}
#sidebar h2{font-size:12px;padding:12px 14px 6px;margin:0;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.agent{padding:10px 14px;cursor:pointer;border-left:3px solid transparent}
.agent:hover{background:#161b22}
.agent.active{background:#161b22;border-left-color:var(--acc)}
.agent b{display:block;font-size:13px}
.agent span{font-size:11px;color:var(--dim);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#chat{flex:1;overflow-y:auto;padding:16px}
.msg{max-width:75%;margin:8px 0;padding:9px 13px;border-radius:10px;white-space:pre-wrap;word-wrap:break-word;font-size:14px;line-height:1.5}
.user{background:#1f6feb33;margin-left:auto}
.assistant{background:var(--panel);border:1px solid var(--border)}
.sys{color:var(--dim);font-size:12px;margin:6px auto;text-align:center}
#inputbar{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);background:#010409}
#inputbar textarea{flex:1;resize:none;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font:inherit;height:44px}
#gate{position:fixed;inset:0;background:#0d1117ee;display:flex;align-items:center;justify-content:center;z-index:30}
#gate .box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px;width:min(320px,92vw)}
#gate input{width:100%;margin:12px 0}
@media (max-width:640px){#sidebar{width:140px}.agent span{display:none}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/">Agent Manager</a>
  <nav>
    <a href="/setup/">Setup</a>
    <a href="/connect/">Connect</a>
    <a href="/brain/">Brain</a>
    <a class="on" href="/agents/">Agents</a>
  </nav>
</header>

<div id="gate">
  <div class="box">
    <b>Token</b>
    <input id="token" type="password" placeholder="Paste token" autocomplete="current-password">
    <button class="btn primary" style="width:100%" onclick="unlock()">Unlock</button>
    <p class="hint"><a href="/setup/">Get a token</a></p>
  </div>
</div>

<div class="shell">
  <div id="sidebar"><h2>Helpers</h2><div id="agents"></div></div>
  <div id="main">
    <div id="chat"></div>
    <div id="inputbar">
      <textarea id="msg" placeholder="Message…"></textarea>
      <button class="btn primary" id="send" onclick="send()">Send</button>
    </div>
  </div>
</div>
<script>
let TOKEN = localStorage.getItem('am_token') || '';
let AGENTS = [], ACTIVE = null;
const $ = id => document.getElementById(id);
const chat = $('chat');

async function api(path, opts={}) {
  const r = await fetch(path, {...opts, headers:{'Content-Type':'application/json','X-Token':TOKEN,...(opts.headers||{})}});
  if (r.status === 401) { localStorage.removeItem('am_token'); TOKEN=''; $('gate').style.display='flex'; throw new Error('unauthorized'); }
  return r.json();
}
function unlock() {
  TOKEN = $('token').value.trim();
  if (!TOKEN) return;
  localStorage.setItem('am_token', TOKEN);
  api('/api/agents').then(d => { $('gate').style.display='none'; AGENTS=d.agents; renderAgents(); }).catch(()=>{ $('token').value=''; });
}
function renderAgents() {
  $('agents').innerHTML = AGENTS.map(a =>
    `<div class="agent" data-n="${a.name}" onclick="pick('${a.name}')"><b>${a.name}</b><span>${a.blurb||''}</span></div>`).join('');
}
async function pick(name) {
  ACTIVE = name;
  document.querySelectorAll('.agent').forEach(e => e.classList.toggle('active', e.dataset.n === name));
  chat.innerHTML = '<div class="sys">…</div>';
  const d = await api('/api/history?agent='+name);
  chat.innerHTML = '';
  (d.history||[]).forEach(addMsg);
  if (!(d.history||[]).length) chat.innerHTML = '<div class="sys">Say hello.</div>';
  chat.scrollTop = chat.scrollHeight;
}
function addMsg(m) {
  const div = document.createElement('div');
  div.className = 'msg ' + m.role;
  div.textContent = m.text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
async function send() {
  const input = $('msg');
  const text = input.value.trim();
  if (!text || !ACTIVE) return;
  input.value = ''; $('send').disabled = true;
  addMsg({role:'user', text});
  const busy = document.createElement('div');
  busy.className = 'sys'; busy.textContent = '…';
  chat.appendChild(busy); chat.scrollTop = chat.scrollHeight;
  try {
    const d = await api('/api/chat', {method:'POST', body: JSON.stringify({agent:ACTIVE, message:text})});
    busy.remove();
    addMsg({role:'assistant', text:d.reply || '(empty)'});
  } catch(e) { busy.textContent = 'error'; }
  $('send').disabled = false; input.focus();
}
$('msg').addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); }});
if (TOKEN) { $('token').value = TOKEN; unlock(); }
</script>
</body>
</html>
