<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Manager</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin:0; font-family: ui-sans-serif,system-ui,sans-serif; background:#0d1117; color:#e6edf3; display:flex; height:100vh; }
#sidebar { width:230px; background:#010409; border-right:1px solid #21262d; overflow-y:auto; flex-shrink:0; }
#sidebar h1 { font-size:15px; padding:14px 14px 8px; margin:0; color:#7ee787; }
.agent { padding:8px 14px; cursor:pointer; border-left:3px solid transparent; }
.agent:hover { background:#161b22; }
.agent.active { background:#161b22; border-left-color:#7ee787; }
.agent b { display:block; font-size:13px; }
.agent span { font-size:11px; color:#8b949e; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#main { flex:1; display:flex; flex-direction:column; min-width:0; }
#chat { flex:1; overflow-y:auto; padding:18px 22px; }
.msg { max-width:75%; margin:8px 0; padding:9px 13px; border-radius:10px; white-space:pre-wrap; word-wrap:break-word; font-size:14px; line-height:1.5; }
.user { background:#1f6feb33; margin-left:auto; }
.assistant { background:#161b22; border:1px solid #21262d; }
.sys { color:#8b949e; font-size:12px; margin:6px auto; text-align:center; }
#inputbar { display:flex; gap:8px; padding:12px 16px; border-top:1px solid #21262d; background:#010409; }
#inputbar textarea { flex:1; resize:none; background:#0d1117; color:#e6edf3; border:1px solid #30363d; border-radius:8px; padding:10px 12px; font-size:14px; font-family:inherit; height:44px; }
button { background:#238636; color:#fff; border:0; border-radius:8px; padding:0 18px; font-size:14px; cursor:pointer; }
button:disabled { opacity:.5; cursor:default; }
#gate { position:fixed; inset:0; background:#0d1117ee; display:flex; align-items:center; justify-content:center; z-index:10; }
#gate .box { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:26px; width:320px; }
#gate input { width:100%; margin:12px 0; padding:10px; background:#0d1117; color:#e6edf3; border:1px solid #30363d; border-radius:8px; }
.hint { font-size:12px; color:#8b949e; }
@media (max-width:640px){ #sidebar{width:170px} .agent span{display:none} }
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <b>Agent Manager</b>
    <input id="token" type="password" placeholder="Access token">
    <button onclick="unlock()">Unlock</button>
    <p class="hint">Same token from <a href="/setup/" style="color:#58a6ff">/setup</a>. New here? <a href="/setup/" style="color:#58a6ff">Create or save a token</a>.</p>
  </div>
</div>
<div id="sidebar"><h1>Agents</h1><div id="agents"></div>
<a href="/" style="display:block;margin:12px 8px 4px;color:inherit;opacity:.75;font-size:14px">Home →</a>
<a href="/setup/" style="display:block;margin:4px 8px;color:inherit;opacity:.75;font-size:14px">Setup / token →</a>
<a href="/connect/" style="display:block;margin:4px 8px;color:inherit;opacity:.75;font-size:14px">Connect any agent →</a>
<a href="/brain/" id="brain-link" style="display:block;margin:4px 8px 12px;color:inherit;opacity:.75;font-size:14px">Shared Brain →</a></div>
<div id="main">
  <div id="chat"></div>
  <div id="inputbar">
    <textarea id="msg" placeholder="Message the agent…"></textarea>
    <button id="send" onclick="send()">Send</button>
  </div>
</div>
<script>
let TOKEN = localStorage.getItem('am_token') || '';
let AGENTS = [], ACTIVE = null;

const $ = id => document.getElementById(id);
const chat = $('chat');

async function api(path, opts={}) {
  const r = await fetch(path, {...opts, headers:{'Content-Type':'application/json','X-Token':TOKEN,...(opts.headers||{})}});
  if (r.status === 401) { localStorage.removeItem('am_token'); TOKEN=''; $('gate').style.display='flex'; throw new Error('unauthorized'); }
  return r.json();
}

function unlock() {
  TOKEN = $('token').value.trim();
  if (!TOKEN) return;
  localStorage.setItem('am_token', TOKEN);
  api('/api/agents').then(d => { $('gate').style.display='none'; AGENTS=d.agents; renderAgents(); }).catch(()=>{ $('token').value=''; });
}

function renderAgents() {
  $('agents').innerHTML = AGENTS.map(a =>
    `<div class="agent" data-n="${a.name}" onclick="pick('${a.name}')"><b>${a.name}</b><span>${a.blurb||''}</span></div>`).join('');
}

async function pick(name) {
  ACTIVE = name;
  document.querySelectorAll('.agent').forEach(e => e.classList.toggle('active', e.dataset.n === name));
  chat.innerHTML = '<div class="sys">loading history…</div>';
  const d = await api('/api/history?agent='+name);
  chat.innerHTML = '';
  (d.history||[]).forEach(addMsg);
  if (!(d.history||[]).length) chat.innerHTML = '<div class="sys">No history yet — say hello.</div>';
  chat.scrollTop = chat.scrollHeight;
}

function addMsg(m) {
  const div = document.createElement('div');
  div.className = 'msg ' + m.role;
  div.textContent = m.text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const input = $('msg');
  const text = input.value.trim();
  if (!text || !ACTIVE) return;
  input.value = ''; $('send').disabled = true;
  addMsg({role:'user', text});
  const busy = document.createElement('div');
  busy.className = 'sys'; busy.textContent = ACTIVE + ' is thinking…';
  chat.appendChild(busy); chat.scrollTop = chat.scrollHeight;
  try {
    const d = await api('/api/chat', {method:'POST', body: JSON.stringify({agent:ACTIVE, message:text})});
    busy.remove();
    addMsg({role:'assistant', text:d.reply || '(empty)'});
  } catch(e) { busy.textContent = 'error: '+e.message; }
  $('send').disabled = false; input.focus();
}
$('msg').addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); }});
if (TOKEN) { $('token').value = TOKEN; unlock(); }
</script>
</body>
</html>
