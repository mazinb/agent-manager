<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents — Zoro</title>
<style>
:root{
  --bg:#111214; --panel:#17181b; --border:#26272b; --fg:#e6e4df;
  --dim:#9c9a94; --faint:#6f6d68; --acc:#d9a55b; --acc-dim:#d9a55b26;
  --ok:#4a9d5f; --warn:#d29922; --chrome-h:48px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.45 ui-sans-serif,system-ui,sans-serif}
a{color:var(--acc);text-decoration:none}
code{font:12.5px/1.4 ui-monospace,Menlo,monospace}

.top{display:flex;align-items:center;gap:10px;height:var(--chrome-h);
  padding:0 14px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30;
  background:#111214f5;backdrop-filter:blur(10px)}
.top .brand{font-size:15px;font-weight:700;letter-spacing:-.02em;color:var(--fg)}
.top .brand:hover{color:var(--acc)}
.top nav{margin-left:auto;display:flex;gap:2px}
.top nav a{color:var(--dim);font-size:13px;padding:6px 10px;border-radius:4px}
.top nav a:hover{color:var(--fg);background:var(--panel)}
.top nav a.on{color:var(--acc);background:var(--acc-dim)}

.wrap{max-width:720px;margin:0 auto;padding:0 16px 72px}
.sub{color:var(--dim);margin:0;font-size:13px}
.hint{font-size:12px;color:var(--dim);margin:8px 0 0}
.warn{color:var(--warn)}.okmsg{color:var(--ok)}.hidden{display:none!important}

/* slim page actions row under the header */
.page-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:10px 0;border-bottom:1px solid var(--border)}
.page-actions .spacer{margin-left:auto}
.page-actions select{width:auto;min-width:160px}

/* flat sections: thin headings + dividers, no cards */
.sec{padding:18px 0 20px;border-bottom:1px solid var(--border)}
.sec:last-child{border-bottom:0}
.sec > h2{margin:0 0 12px;font-size:11px;font-weight:600;color:var(--dim);
  text-transform:uppercase;letter-spacing:.08em}

.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;
  gap:6px;padding:0 12px;height:32px;border-radius:4px;font-weight:600;font-size:13px;
  border:1px solid transparent;cursor:pointer;font-family:inherit;color:inherit;background:none}
.btn.primary{background:var(--acc);color:#1a1206}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--border)}
.btn.ghost:hover{border-color:#3a3b40}
.btn.danger{color:#d98f7f;border-color:var(--border)}
.btn.danger:hover{border-color:#5a3a32}
.btn.ok{background:var(--ok);color:#04120a}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{width:32px;padding:0;font-weight:400;font-size:15px;color:var(--dim)}
.icon-btn:hover{color:var(--fg)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--border);
  color:var(--fg);border-radius:4px;padding:0 11px;height:44px;font:inherit}
textarea{height:auto;min-height:44px;padding:10px 11px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
label{display:block;font-size:12px;color:var(--dim);margin:0 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.field{flex:1;min-width:120px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--dim);font-weight:600;font-size:11px;
  text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--border)}
td{padding:10px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
.name{font-weight:650;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.dim-txt{color:var(--dim);font-size:12px}
/* roles/modes are plain dim text — no pills */
.role-txt,.mode-txt,.status-txt{color:var(--dim);font-size:12.5px}
.status-txt.open{color:var(--acc)}
.status-txt.done{color:var(--ok)}
.status-txt.blocked{color:var(--warn)}

/* one row action menu */
.menu{position:relative;display:inline-block}
.menu>summary{list-style:none;cursor:pointer;width:30px;height:30px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:15px}
.menu>summary::-webkit-details-marker{display:none}
.menu>summary:hover{background:var(--panel);color:var(--fg)}
.menu-items{position:absolute;right:0;top:32px;z-index:20;min-width:170px;
  background:var(--panel);border:1px solid var(--border);border-radius:4px;
  padding:6px;display:flex;flex-direction:column;gap:4px}
.menu-items .btn{width:100%;justify-content:flex-start;height:34px;font-weight:500}
.menu-items .m-add{display:flex;gap:6px;align-items:center}
.menu-items .m-add select{height:34px;width:auto;flex:1;font-size:12px;padding:0 6px}
.menu-items .m-add .btn{width:auto;height:34px}
.menu[open] .menu-items{display:flex}

.reveal{background:var(--panel);border:1px solid var(--warn);border-radius:4px;padding:12px;margin-top:10px}
.reveal .tok{font:13px/1.4 ui-monospace,Menlo,monospace;word-break:break-all;margin:0 0 8px}

/* rules: one row per rule */
.rule{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.rule .r-text{color:var(--dim);font-size:12.5px;white-space:nowrap}
.rule .r-arrow{color:var(--faint)}
.rule .r-match{flex:1;min-width:140px;width:auto}
.rule .r-agent{width:auto;min-width:130px;flex:0 0 auto}
.rule .r-en{display:flex;align-items:center;gap:5px;color:var(--dim);font-size:12px;white-space:nowrap}
.rule .r-en input{width:15px;height:15px;padding:0;accent-color:var(--acc)}
.rule .r-del{flex:0 0 auto}

@media (max-width:640px){
  .top{padding:0 10px}
  .wrap{padding:0 12px 64px}
  .hide-sm{display:none}
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/">Zoro</a>
  <nav>
    <a href="/inbox/">Inbox</a>
    <a class="on" href="/agents/">Agents</a>
    <a href="/brain/">Brain</a>
  </nav>
</header>
<main class="wrap">

  <div id="gate">
    <div class="page-actions">
      <span class="sub" id="gate-hint">Token needed to manage agents.</span>
      <span class="spacer"></span>
      <button type="button" class="btn primary" id="btn-create">Create</button>
      <button type="button" class="btn ghost" id="btn-paste-toggle">Paste</button>
    </div>
    <div id="paste-box" class="hidden" style="margin-top:10px">
      <input id="paste" type="password" placeholder="Paste token">
      <div class="actions"><button type="button" class="btn primary" id="btn-save-paste">Save</button></div>
    </div>
    <div id="once" class="reveal hidden">
      <p class="warn" style="margin:0 0 6px;font-size:12px">Copy now — once.</p>
      <div class="tok" id="once-tok"></div>
      <div class="actions">
        <button type="button" class="btn primary" id="btn-copy-tok">Copy</button>
        <button type="button" class="btn ghost" id="btn-dismiss">Saved</button>
      </div>
    </div>
  </div>

  <div id="app" class="hidden">
    <div class="page-actions">
      <button type="button" class="btn ghost" id="btn-refresh">Refresh</button>
      <select id="board-sel" aria-label="Filter by chat"></select>
      <span class="spacer"></span>
      <span class="sub" id="board-link"></span>
    </div>

    <section class="sec">
      <h2>Board</h2>
      <div class="row">
        <div class="field">
          <label>New chat</label>
          <input id="new-chat" placeholder="e.g. travel">
        </div>
        <button type="button" class="btn primary" id="btn-new-board">Open</button>
      </div>
      <p class="hint">Board ↔ inbox chat. Members may claim tasks.</p>
    </section>

    <section class="sec">
      <h2>Team</h2>
      <table>
        <thead><tr><th>Agent</th><th>Role</th><th>Mode</th><th>Key</th><th></th></tr></thead>
        <tbody id="team-rows"></tbody>
      </table>
      <div class="row" style="margin-top:12px">
        <div class="field"><label>Add agent</label><input id="new-agent" placeholder="e.g. travel-helper"></div>
        <button type="button" class="btn primary" id="btn-add-agent">Add</button>
      </div>
      <div id="key-once" class="reveal hidden">
        <p class="warn" style="margin:0 0 6px;font-size:12px">Key for <span id="key-agent"></span> — once.</p>
        <div class="tok" id="key-tok"></div>
        <div class="actions">
          <button type="button" class="btn primary" id="btn-copy-key">Copy</button>
          <button type="button" class="btn ghost" id="btn-key-dismiss">Saved</button>
        </div>
      </div>
    </section>

    <section class="sec">
      <h2>Tasks</h2>
      <table>
        <thead><tr><th>Task</th><th>Who</th><th class="hide-sm">Mode</th><th>Status</th><th></th></tr></thead>
        <tbody id="task-rows"></tbody>
      </table>
      <div class="row" style="margin-top:12px">
        <div class="field" style="flex:2"><label>Title</label><input id="task-title" placeholder="on-device: …"></div>
        <div class="field"><label>Assign</label>
          <select id="task-assignee"><option value="">auto</option></select>
        </div>
        <div class="field" style="flex:0 0 auto">
          <label><input type="checkbox" id="task-parallel" style="width:15px;height:15px;padding:0;accent-color:var(--acc)"> Parallel</label>
        </div>
        <button type="button" class="btn primary" id="btn-add-task">Add</button>
      </div>
      <p class="hint">Only board members can be assigned or claim.</p>
    </section>

    <section class="sec">
      <h2>Rules</h2>
      <p class="hint" style="margin:0 0 10px">First match wins.</p>
      <div id="rules"></div>
      <div class="actions">
        <button type="button" class="btn ghost" id="btn-add-rule">Add rule</button>
        <button type="button" class="btn primary" id="btn-save-rules">Save</button>
      </div>
    </section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const KEY = 'am_token';
let TOK = localStorage.getItem(KEY) || '';
let AGENTS = [], TASKS = [], RULES = [], BOARDS = [], BOARD = null;
const params = new URLSearchParams(location.search);
let CHAT = params.get('chat') || 'peers';

async function api(path, opts={}){
  const r = await fetch(path, {
    ...opts,
    headers: {'X-Token': TOK, 'Content-Type':'application/json', ...(opts.headers||{})},
  });
  const d = await r.json().catch(()=>({}));
  if(r.status === 401) throw new Error('unauthorized');
  if(!r.ok) throw new Error(d.error || ('HTTP '+r.status));
  return d;
}

async function copy(text, btn){
  await navigator.clipboard.writeText(text);
  const o = btn.textContent; btn.textContent = 'Copied'; btn.classList.add('ok');
  setTimeout(() => { btn.textContent = o; btn.classList.remove('ok'); }, 1000);
}

function showApp(on){
  $('gate').classList.toggle('hidden', on);
  $('app').classList.toggle('hidden', !on);
}

async function boot(){
  if(!TOK){ showApp(false); return; }
  try {
    await refresh();
    showApp(true);
  } catch {
    showApp(false);
  }
}

async function refresh(){
  const [a, boards, board] = await Promise.all([
    api('/api/roster/agents'),
    api('/api/roster/boards'),
    api('/api/roster/board?chat=' + encodeURIComponent(CHAT)),
  ]);
  AGENTS = a.agents || [];
  BOARDS = boards.boards || [];
  BOARD = board;
  CHAT = board.chat || CHAT;
  const q = 'chat=' + encodeURIComponent(CHAT);
  const [t, r] = await Promise.all([
    api('/api/roster/tasks?' + q),
    api('/api/roster/rules?' + q),
  ]);
  TASKS = t.tasks || [];
  RULES = r.rules || [];
  renderBoards();
  renderTeam();
  renderTasks();
  renderRules();
  const members = BOARD.members || [];
  const sel = $('task-assignee');
  const cur = sel.value;
  sel.innerHTML = '<option value="">auto</option>' +
    members.map(x => `<option value="${x.agent}">${esc(x.label)}</option>`).join('');
  sel.value = cur;
  $('board-link').innerHTML =
    `chat <code>${esc(CHAT)}</code> · ${BOARD.open_tasks || 0} open`;
}

function renderBoards(){
  const sel = $('board-sel');
  const chats = new Set(BOARDS.map(b => b.chat));
  if(!chats.has(CHAT)) BOARDS = [...BOARDS, BOARD].filter(Boolean);
  sel.innerHTML = BOARDS.map(b =>
    `<option value="${esc(b.chat)}" ${b.chat===CHAT?'selected':''}>${esc(b.title || b.chat)}</option>`
  ).join('');
}

/* Team: roster + board membership merged into one list */
function renderTeam(){
  const members = new Map(((BOARD && BOARD.members) || []).map(m => [m.agent, m]));
  const names = new Set([
    ...AGENTS.map(a => a.name),
    ...members.keys(),
  ]);
  if(!names.size){
    $('team-rows').innerHTML = '<tr><td colspan="5" class="hint">No agents.</td></tr>';
    return;
  }
  const byName = new Map(AGENTS.map(a => [a.name, a]));
  $('team-rows').innerHTML = [...names].sort().map(n => {
    const a = byName.get(n) || {name:n, label:n, has_key:false, token_hint:'', parallel_ok:true};
    const m = members.get(n);
    const role = m ? m.role : '';
    const key = a.has_key ? `set ····${esc(a.token_hint||'')}` : 'none';
    const mode = a.parallel_ok ? 'parallel' : 'serial';
    return `<tr>
      <td><span class="name">${esc(a.label)}</span>
        <div class="dim-txt" style="margin:0">${esc(n)}</div></td>
      <td><span class="role-txt">${esc(role || '—')}</span></td>
      <td><span class="mode-txt">${mode}</span></td>
      <td><span class="dim-txt">${key}</span></td>
      <td style="text-align:right;white-space:nowrap">
        <details class="menu">
          <summary aria-label="Actions">···</summary>
          <div class="menu-items">
            <button type="button" class="btn ghost" data-key="${esc(n)}">Mint key</button>
            ${m
              ? `<button type="button" class="btn danger" data-rm="${esc(n)}">Remove from board</button>`
              : `<div class="m-add">
                   <select class="m-role" data-add-role="${esc(n)}">
                     <option value="worker">worker</option>
                     <option value="member">member</option>
                     <option value="admin">admin</option>
                   </select>
                   <button type="button" class="btn primary" data-add="${esc(n)}">Add</button>
                 </div>`}
          </div>
        </details>
      </td>
    </tr>`;
  }).join('');
  $('team-rows').querySelectorAll('[data-key]').forEach(b => {
    b.onclick = () => { b.closest('details').open = false; mintKey(b.dataset.key); };
  });
  $('team-rows').querySelectorAll('[data-rm]').forEach(b => {
    b.onclick = async () => {
      b.closest('details').open = false;
      if(!confirm('Remove '+b.dataset.rm+'?')) return;
      try {
        await api('/api/roster/board/members/remove', {
          method:'POST', body: JSON.stringify({chat: CHAT, agent: b.dataset.rm})});
        await refresh();
      } catch(e){ alert(e.message); }
    };
  });
  $('team-rows').querySelectorAll('[data-add]').forEach(b => {
    b.onclick = async () => {
      const n = b.dataset.add;
      const role = b.parentElement.querySelector('.m-role').value;
      b.closest('details').open = false;
      try {
        await api('/api/roster/board/members', {method:'POST', body: JSON.stringify({
          chat: CHAT, agent: n, role})});
        await refresh();
      } catch(e){ alert(e.message); }
    };
  });
}

function renderTasks(){
  if(!TASKS.length){
    $('task-rows').innerHTML = '<tr><td colspan="5" class="hint">No tasks.</td></tr>';
    return;
  }
  $('task-rows').innerHTML = TASKS.map(t =>
    `<tr>
      <td><div class="name" style="font-family:inherit;font-weight:600">${esc(t.title)}</div>
        ${t.body ? `<div class="hint" style="margin:2px 0 0">${esc(t.body.slice(0,80))}</div>` : ''}</td>
      <td><span class="name">${esc(t.assignee || '—')}</span>
        ${t.created_by ? `<div class="dim-txt" style="margin:0">by ${esc(t.created_by)}</div>` : ''}</td>
      <td class="hide-sm"><span class="mode-txt">${t.parallel?'parallel':'serial'}</span></td>
      <td><span class="status-txt ${esc(t.status)}">${esc(t.status)}</span></td>
      <td style="text-align:right;white-space:nowrap">
        ${t.status==='open'||t.status==='blocked'
          ? `<button type="button" class="btn ghost" data-claim="${t.id}">Claim</button>` : ''}
        ${t.status==='claimed'
          ? `<button type="button" class="btn ghost" data-done="${t.id}">Done</button>` : ''}
      </td>
    </tr>`
  ).join('');
  $('task-rows').querySelectorAll('[data-claim]').forEach(b => {
    b.onclick = async () => {
      const agent = prompt('Claim as agent', 'hermes');
      if(!agent) return;
      try { await api('/api/roster/tasks/claim', {method:'POST', body: JSON.stringify({id:+b.dataset.claim, agent})}); await refresh(); }
      catch(e){ alert(e.message); }
    };
  });
  $('task-rows').querySelectorAll('[data-done]').forEach(b => {
    b.onclick = async () => {
      await api('/api/roster/tasks/update', {method:'POST', body: JSON.stringify({id:+b.dataset.done, status:'done'})});
      await refresh();
    };
  });
}

function renderRules(){
  const members = (BOARD && BOARD.members) || [];
  const opts = members.length ? members : AGENTS.map(a => ({agent:a.name, label:a.label}));
  $('rules').innerHTML = RULES.map((r,i) =>
    `<div class="rule" data-i="${i}">
      <span class="r-text">if text contains</span>
      <input class="r-match" value="${esc(r.match)}" placeholder="text">
      <span class="r-arrow">&rarr;</span>
      <select class="r-agent">${opts.map(a =>
        `<option value="${a.agent || a.name}" ${(a.agent||a.name)===r.agent?'selected':''}>${esc(a.label)}</option>`).join('')}</select>
      <label class="r-en"><input type="checkbox" class="r-en-box" ${r.enabled !== false ? 'checked' : ''}> enabled</label>
      <button type="button" class="btn ghost icon-btn r-del" aria-label="Delete rule">&times;</button>
    </div>`
  ).join('') || '<p class="hint">No rules.</p>';
  $('rules').querySelectorAll('.r-del').forEach(b => {
    b.onclick = () => {
      const i = +b.closest('.rule').dataset.i;
      RULES.splice(i, 1);
      renderRules();
    };
  });
}

function esc(s){
  return (s??'').toString().replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function mintKey(name){
  if(!confirm('Mint new key for '+name+'? Old key stops working.')) return;
  const d = await api('/api/roster/agents/key', {method:'POST', body: JSON.stringify({name})});
  $('key-agent').textContent = name;
  $('key-tok').textContent = d.token;
  $('key-once').classList.remove('hidden');
  await refresh();
}

$('btn-key-dismiss').onclick = () => {
  $('key-once').classList.add('hidden');
  $('key-tok').textContent = '';
};
$('btn-copy-key').onclick = ev => copy($('key-tok').textContent, ev.currentTarget);
$('btn-refresh').onclick = () => refresh().catch(e => alert(e.message));

$('board-sel').onchange = async () => {
  CHAT = $('board-sel').value;
  history.replaceState(null, '', '?chat=' + encodeURIComponent(CHAT));
  await refresh();
};
$('btn-new-board').onclick = async () => {
  const chat = $('new-chat').value.trim();
  if(!chat) return;
  await api('/api/roster/boards', {method:'POST', body: JSON.stringify({chat})});
  CHAT = chat;
  $('new-chat').value = '';
  history.replaceState(null, '', '?chat=' + encodeURIComponent(CHAT));
  await refresh();
};

$('btn-add-agent').onclick = async () => {
  const name = $('new-agent').value.trim();
  if(!name) return;
  await api('/api/roster/agents', {method:'POST', body: JSON.stringify({name})});
  $('new-agent').value = '';
  await refresh();
};

$('btn-add-task').onclick = async () => {
  const title = $('task-title').value.trim();
  if(!title) return;
  try {
    await api('/api/roster/tasks', {method:'POST', body: JSON.stringify({
      title,
      chat: CHAT,
      assignee: $('task-assignee').value,
      parallel: $('task-parallel').checked,
      created_by: 'you',
    })});
    $('task-title').value = '';
    await refresh();
  } catch(e){ alert(e.message); }
};

$('btn-add-rule').onclick = () => {
  const members = (BOARD && BOARD.members) || [];
  RULES.push({match:'', agent: members[0]?.agent || AGENTS[0]?.name || 'hermes',
              parallel:false, enabled:true, priority:0});
  renderRules();
};
$('btn-save-rules').onclick = async () => {
  const rules = [...$('rules').querySelectorAll('.rule')].map((el, i) => ({
    match: el.querySelector('.r-match').value.trim(),
    agent: el.querySelector('.r-agent').value,
    parallel: !!(RULES[i] && RULES[i].parallel),
    priority: RULES[i] ? RULES[i].priority : undefined,
    enabled: el.querySelector('.r-en-box').checked,
  })).filter(r => r.match);
  await api('/api/roster/rules', {method:'POST', body: JSON.stringify({rules, chat: CHAT})});
  await refresh();
};

// gate
$('btn-create').onclick = async () => {
  const s = await fetch('/api/setup/status').then(r=>r.json());
  const path = s.bootstrap ? '/api/setup/bootstrap' : '/api/setup/signup';
  const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({label:'agents'})});
  const d = await r.json();
  if(!r.ok){ alert(d.error||'failed'); return; }
  TOK = d.token;
  localStorage.setItem(KEY, TOK);
  $('once-tok').textContent = TOK;
  $('once').classList.remove('hidden');
};
$('btn-dismiss').onclick = async () => {
  $('once').classList.add('hidden');
  await boot();
};
$('btn-copy-tok').onclick = ev => copy($('once-tok').textContent, ev.currentTarget);
$('btn-paste-toggle').onclick = () => $('paste-box').classList.toggle('hidden');
$('btn-save-paste').onclick = async () => {
  TOK = $('paste').value.trim();
  if(!TOK) return;
  localStorage.setItem(KEY, TOK);
  await boot();
};

boot();
