<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect — Agent Manager</title>
<link rel="stylesheet" href="/static/app.css">
<style>
.toolbar{display:flex;justify-content:flex-end;margin:0 0 8px}
.copy{background:#21262d;color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
.copy.ok{border-color:var(--ok);color:var(--ok)}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/">Agent Manager</a>
  <nav>
    <a href="/setup/">Setup</a>
    <a class="on" href="/connect/">Connect</a>
    <a href="/brain/">Brain</a>
  </nav>
</header>
<main class="wrap">
  <p class="sub" id="status"><a href="/setup/">Get a token</a> if you don’t have one.</p>

  <div class="card">
    <div class="row">
      <div class="field">
        <label for="base">URL</label>
        <input id="base" placeholder="https://bot.getzoro.com">
      </div>
      <div class="field">
        <label for="token">Token</label>
        <input id="token" type="password" placeholder="Access token" autocomplete="current-password">
      </div>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="panel"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const DEFAULT_BASE = (location.origin.includes('localhost') || location.origin.includes('127.0.0.1'))
  ? location.origin : 'https://bot.getzoro.com';
$('base').value = localStorage.getItem('am_base') || DEFAULT_BASE;
$('token').value = localStorage.getItem('am_token') || '';

function base() {
  return ($('base').value || DEFAULT_BASE).replace(/\/+$/, '').replace(/\/mcp$/, '');
}
function token() { return ($('token').value || '').trim(); }
function mcpUrl() { return base() + '/mcp'; }
function tokFlag() { return token() ? ` --token ${token()}` : ' --token YOUR_TOKEN'; }

function mcpJson(style='generic') {
  const t = token();
  if (style === 'vscode') {
    return JSON.stringify({
      servers: { 'agent-manager': {
        type: 'http', url: mcpUrl(),
        ...(t ? { headers: { 'X-Token': t } } : {}),
      }},
    }, null, 2);
  }
  if (style === 'continue') {
    return ['mcpServers:', '  - name: agent-manager', `    url: ${mcpUrl()}`,
      ...(t ? ['    headers:', `      X-Token: ${t}`] : [])].join('\n');
  }
  if (style === 'zed') {
    return JSON.stringify({
      context_servers: { 'agent-manager': {
        url: mcpUrl(), ...(t ? { headers: { 'X-Token': t } } : {}),
      }},
    }, null, 2);
  }
  return JSON.stringify({
    mcpServers: { 'agent-manager': {
      url: mcpUrl(), ...(t ? { headers: { 'X-Token': t } } : {}),
    }},
  }, null, 2);
}

const PLATFORMS = [
  { id:'npx', label:'npm', title:'npx',
    code(){ return `npx --yes agent-manager-brain connect --url ${base()}${tokFlag()} --agent vscode`; }},
  { id:'selfhost', label:'Self-host', title:'Self-host',
    code(){ return [
      `npx --yes agent-manager-brain init`,
      `npx --yes agent-manager-brain serve`,
      `npx --yes agent-manager-brain connect --url http://127.0.0.1:8075${tokFlag()} --agent generic`,
    ].join('\n'); }},
  { id:'claude', label:'Claude', title:'Claude Code',
    code(){ const h = token() ? ` \\\n  --header "X-Token: ${token()}"` : '';
      return `claude mcp add --transport http agent-manager ${mcpUrl()}${h}`; }},
  { id:'vscode', label:'VS Code', title:'VS Code / Copilot', code:()=>mcpJson('vscode') },
  { id:'cursor', label:'Cursor', title:'Cursor', code:()=>mcpJson('generic') },
  { id:'windsurf', label:'Windsurf', title:'Windsurf', code:()=>mcpJson('generic') },
  { id:'cline', label:'Cline', title:'Cline', code:()=>mcpJson('generic') },
  { id:'continue', label:'Continue', title:'Continue', code:()=>mcpJson('continue') },
  { id:'zed', label:'Zed', title:'Zed', code:()=>mcpJson('zed') },
  { id:'generic', label:'JSON', title:'MCP JSON', code:()=>mcpJson('generic') },
  { id:'curl', label:'curl', title:'curl',
    code(){ const t=token()||'YOUR_TOKEN'; const b=base();
      return `curl -s "${b}/api/search?q=test" -H "X-Token: ${t}"`; }},
];

let ACTIVE = 'npx';

function persist() {
  localStorage.setItem('am_base', base());
  if (token()) localStorage.setItem('am_token', token());
  $('status').innerHTML = token()
    ? 'Token in snippets — keep private.'
    : '<a href="/setup/">Get a token</a> if you don’t have one.';
}

async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
    const old = btn.textContent;
    btn.textContent = 'Copied';
    btn.classList.add('ok');
    setTimeout(() => { btn.textContent = old; btn.classList.remove('ok'); }, 1000);
  } catch { btn.textContent = 'Select'; }
}

function render() {
  persist();
  $('tabs').innerHTML = PLATFORMS.map(p =>
    `<button data-id="${p.id}" class="${p.id===ACTIVE?'on':''}">${p.label}</button>`
  ).join('');
  const p = PLATFORMS.find(x => x.id === ACTIVE) || PLATFORMS[0];
  const code = p.code();
  $('panel').innerHTML = `
    <div class="card">
      <h2>${p.title}</h2>
      <div class="toolbar"><button class="copy" type="button">Copy</button></div>
      <pre id="snippet"></pre>
    </div>`;
  $('snippet').textContent = code;
  $('panel').querySelector('.copy').onclick = ev => copyText(code, ev.currentTarget);
}

$('tabs').onclick = e => {
  const b = e.target.closest('button[data-id]');
  if (!b) return;
  ACTIVE = b.dataset.id;
  render();
};
$('base').addEventListener('input', render);
$('token').addEventListener('input', render);
render();
</script>
</body>
</html>
