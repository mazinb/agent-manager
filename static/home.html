<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Manager</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">Agent Manager</a>
  <nav>
    <a href="/setup/">Setup</a>
    <a href="/connect/">Connect</a>
    <a href="/brain/">Brain</a>
    <a href="/agents/">Agents</a>
  </nav>
</header>
<main class="wrap">
  <h1 class="hero">Shared brain for coding agents</h1>
  <p class="sub" id="status">…</p>
  <div class="actions">
    <a class="btn primary" href="/setup/">Get token</a>
    <a class="btn ghost" href="/connect/">Connect</a>
  </div>

  <div class="card">
    <div class="row">
      <div class="field">
        <label for="token">Token</label>
        <input id="token" type="password" placeholder="Paste token" autocomplete="current-password">
      </div>
      <button class="btn ok" type="button" onclick="saveToken()">Open brain</button>
    </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
async function boot(){
  try{
    const s = await fetch('/api/setup/status').then(r=>r.json());
    if(s.bootstrap) $('status').innerHTML = 'No token yet — <a href="/setup/">create one</a>.';
    else if(s.signup_open) $('status').innerHTML = 'Signup open — <a href="/setup/">get a token</a>.';
    else $('status').textContent = 'Private brain. Paste a token or self-host.';
  }catch{ $('status').textContent = 'Offline.'; }
  const t = localStorage.getItem('am_token')||'';
  if(t) $('token').value = t;
}
function saveToken(){
  const t = $('token').value.trim();
  if(!t) return;
  localStorage.setItem('am_token', t);
  location.href = '/brain/';
}
boot();
</script>
</body>
</html>
