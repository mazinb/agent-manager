<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup — Agent Manager</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">Agent Manager</a>
  <nav>
    <a class="on" href="/setup/">Setup</a>
    <a href="/connect/">Connect</a>
    <a href="/brain/">Brain</a>
    <a href="/agents/">Agents</a>
  </nav>
</header>
<main class="wrap">
  <div class="card" id="loading"><p class="sub" style="margin:0">Checking…</p></div>

  <div class="card hidden" id="panel-bootstrap">
    <h2>Create token</h2>
    <p class="sub">Shown once. Save it — UI + MCP use the same value.</p>
    <label for="label">Label</label>
    <input id="label" placeholder="optional">
    <div class="actions" style="margin-top:12px">
      <button class="btn primary" type="button" id="btn-bootstrap" onclick="bootstrap()">Create</button>
    </div>
  </div>

  <div class="card hidden" id="panel-signup">
    <h2>Get token</h2>
    <label for="label2">Label</label>
    <input id="label2" placeholder="optional">
    <label for="invite" style="margin-top:10px">Invite</label>
    <input id="invite" placeholder="if required">
    <div class="actions" style="margin-top:12px">
      <button class="btn primary" type="button" onclick="signup()">Create</button>
    </div>
  </div>

  <div class="card hidden" id="panel-locked">
    <h2>Paste token</h2>
    <p class="sub">Or self-host: <code>npx agent-manager-brain init && npx agent-manager-brain serve</code></p>
    <label for="existing">Token</label>
    <input id="existing" type="password" placeholder="Paste token" autocomplete="current-password">
    <div class="actions" style="margin-top:12px">
      <button class="btn primary" type="button" onclick="saveExisting()">Continue</button>
      <a class="btn ghost" href="/connect/">Connect</a>
    </div>
  </div>

  <div class="card hidden" id="panel-done">
    <h2>Save this token</h2>
    <p class="hint warn">Won’t be shown again.</p>
    <div class="token" id="token-value"></div>
    <div class="actions" style="margin-top:12px">
      <button class="btn primary" type="button" onclick="copyToken()">Copy</button>
      <a class="btn ghost" href="/connect/">Connect</a>
      <a class="btn ghost" href="/brain/">Brain</a>
    </div>
    <p class="hint okmsg" id="copied"></p>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let CREATED = '';
async function boot(){
  const s = await fetch('/api/setup/status').then(r=>r.json());
  $('loading').classList.add('hidden');
  if(s.bootstrap) $('panel-bootstrap').classList.remove('hidden');
  else if(s.signup_open) $('panel-signup').classList.remove('hidden');
  else $('panel-locked').classList.remove('hidden');
  const t = localStorage.getItem('am_token');
  if(t) $('existing').value = t;
}
async function bootstrap(){
  $('btn-bootstrap').disabled = true;
  const r = await fetch('/api/setup/bootstrap', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({label: $('label').value.trim() || 'owner'}),
  });
  const d = await r.json();
  if(!r.ok){ alert(d.error || 'failed'); $('btn-bootstrap').disabled=false; return; }
  showToken(d.token);
}
async function signup(){
  const r = await fetch('/api/setup/signup', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      label: $('label2').value.trim() || 'user',
      invite: $('invite').value.trim(),
    }),
  });
  const d = await r.json();
  if(!r.ok){ alert(d.error || 'failed'); return; }
  showToken(d.token);
}
function showToken(token){
  CREATED = token;
  localStorage.setItem('am_token', token);
  ['panel-bootstrap','panel-signup','panel-locked'].forEach(id => $(id).classList.add('hidden'));
  $('panel-done').classList.remove('hidden');
  $('token-value').textContent = token;
}
function saveExisting(){
  const t = $('existing').value.trim();
  if(!t) return;
  localStorage.setItem('am_token', t);
  location.href = '/brain/';
}
async function copyToken(){
  await navigator.clipboard.writeText(CREATED);
  $('copied').textContent = 'Copied.';
}
boot();
</script>
</body>
</html>
